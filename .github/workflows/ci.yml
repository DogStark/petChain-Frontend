name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run All Tests
    uses: ./.github/workflows/reusable-test.yml
    with:
      skip-frontend: false
      skip-backend: false
      run-coverage: true

  cookie-attributes:
    name: Verify Secure Cookie Attributes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run auth cookie attribute tests
        working-directory: frontend
        run: npx vitest run tests/cookies

  browser-matrix:
    name: Browser Support Matrix (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            project: chromium
          - browser: firefox
            project: firefox
          - browser: webkit
            project: webkit
          - browser: degraded
            project: degraded
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps ${{ matrix.browser == 'degraded' && 'chromium' || matrix.browser }}

      - name: Run browser feature-detection tests
        working-directory: frontend
        run: npx playwright test --project=${{ matrix.project }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}
          path: frontend/playwright-report/
          retention-days: 7

  emergency-profile-performance:
    name: Emergency Profile Performance Budget
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run emergency profile performance budget checks
        working-directory: frontend
        run: npx playwright test --project=emergency-profile-perf

      - name: Upload performance budget report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emergency-profile-perf-report
          path: frontend/playwright-report/
          retention-days: 7

  build:
    name: Build All
    uses: ./.github/workflows/reusable-build.yml
    with:
      skip-frontend: false
      skip-backend: false
      push-docker: false
