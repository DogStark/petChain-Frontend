name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run All Tests
    uses: ./.github/workflows/reusable-test.yml
    with:
      skip-frontend: false
      skip-backend: false
      run-coverage: true

  build:
    name: Build All
    uses: ./.github/workflows/reusable-build.yml
    with:
      skip-frontend: false
      skip-backend: false
      push-docker: false
