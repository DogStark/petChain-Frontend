name: Visual Regression

# Issue #966 — Visual regression coverage for emergency and wallet flows.
#
# ## Trigger
# - Every pull request (for review)
# - Pushes to main (to keep baselines current)
# - Manual dispatch (for updating baselines)
#
# ## Review workflow
# 1. A PR failure uploads a `visual-regression-report` artifact.
# 2. Download the artifact, inspect `playwright-report/index.html`.
# 3. If the diff is an *intentional* UI change, run:
#      gh workflow run visual-regression.yml -f update_baselines=true
#    or locally:
#      npx playwright test tests/visual/ --update-snapshots
#    Then commit the updated snapshot files.
# 4. If the diff is a *regression*, fix the UI before merging.
#
# ## Determinism
# - Dynamic content (wallet addresses, balances, timestamps) is masked in the
#   test itself (see tests/visual/visual-regression.spec.ts).
# - The Node and Playwright versions are pinned; update them deliberately.
# - Fonts are installed explicitly to avoid platform-specific glyph differences.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      update_baselines:
        description: 'Update screenshot baselines (commit result manually)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

concurrency:
  group: visual-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual-regression:
    name: Visual regression — ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    steps:
      # ── Checkout ────────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── Node.js ─────────────────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      # ── Install frontend dependencies ────────────────────────────────────────
      - name: Install dependencies
        run: npm ci

      # ── Install Playwright browsers ──────────────────────────────────────────
      # Pinned to the Playwright version in package.json for reproducible renders.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # ── Build the Next.js app ─────────────────────────────────────────────────
      - name: Build
        run: npm run build
        env:
          # Provide stub env vars so Next.js can build without real services
          NEXT_PUBLIC_APP_NAME: PetChain
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_API_URL: http://localhost:3001
          NEXT_PUBLIC_API_VERSION: v1
          NEXT_PUBLIC_STELLAR_NETWORK: testnet
          NEXT_PUBLIC_STELLAR_HORIZON_URL: https://horizon-testnet.stellar.org

      # ── Start the app ─────────────────────────────────────────────────────────
      - name: Start app (background)
        run: npm start &
        env:
          PORT: 3000
          NEXT_PUBLIC_APP_NAME: PetChain
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_API_URL: http://localhost:3001
          NEXT_PUBLIC_API_VERSION: v1
          NEXT_PUBLIC_STELLAR_NETWORK: testnet
          NEXT_PUBLIC_STELLAR_HORIZON_URL: https://horizon-testnet.stellar.org

      - name: Wait for app to be ready
        run: npx wait-on http://localhost:3000 --timeout 60000

      # ── Run visual regression tests ───────────────────────────────────────────
      - name: Run visual regression tests
        id: vr_tests
        run: |
          if [ "${{ github.event.inputs.update_baselines }}" = "true" ]; then
            npx playwright test tests/visual/ \
              --project=chromium \
              --update-snapshots \
              --shard=${{ matrix.shard }}/3
          else
            npx playwright test tests/visual/ \
              --project=chromium \
              --shard=${{ matrix.shard }}/3
          fi
        env:
          E2E_BASE_URL: http://localhost:3000
          CI: true

      # ── Upload report on failure ──────────────────────────────────────────────
      - name: Upload visual regression report
        if: failure() && steps.vr_tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-report-shard-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14

      # ── Upload updated snapshots on update run ────────────────────────────────
      - name: Upload updated snapshots
        if: github.event.inputs.update_baselines == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: updated-snapshots-shard-${{ matrix.shard }}
          path: tests/visual/snapshots/
          retention-days: 7

  # ── Merge shard reports ────────────────────────────────────────────────────
  merge-reports:
    name: Merge visual regression reports
    runs-on: ubuntu-latest
    needs: [visual-regression]
    if: failure()

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download all shard reports
        uses: actions/download-artifact@v4
        with:
          pattern: visual-regression-report-shard-*
          path: all-reports

      - name: Merge Playwright reports
        run: npx playwright merge-reports --reporter html ./all-reports

      - name: Upload merged report
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-report-merged
          path: playwright-report/
          retention-days: 30
