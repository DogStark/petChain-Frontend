name: Production Build & Route Smoke

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: prod-smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 20

jobs:
  build-and-smoke:
    name: Production Build + Route Smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Start production server
        run: |
          npm run start -p 3000 > /tmp/next-prod.log 2>&1 &
          echo "started-pid=$!" >> "$GITHUB_ENV"
          npx wait-on http://localhost:3000 --timeout 120000

      - name: Smoke test public routes
        run: |
          set -e
          for route in / /login /signup /wallet /clinics /notifications; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:3000$route")
            echo "GET $route -> $code"
            [ "$code" = "200" ] || { echo "Route $route returned $code (expected 200)"; exit 1; }
          done

      - name: Verify CSP header and required directives
        run: |
          set -e
          headers=$(curl -s -D - -o /dev/null http://localhost:3000/)
          csp=$(printf '%s\n' "$headers" | grep -i '^content-security-policy' || true)
          if [ -z "$csp" ]; then
            echo "Missing Content-Security-Policy header on production response"
            exit 1
          fi
          echo "$csp"

          # Required directives must be present.
          for directive in "default-src" "script-src" "style-src" "connect-src" "img-src" "frame-src" "worker-src" "object-src" "base-uri" "form-action"; do
            if ! printf '%s' "$csp" | grep -q "$directive"; then
              echo "CSP is missing required directive: $directive"
              exit 1
            fi
          done

          # Nonce must be threaded through framework scripts.
          if ! printf '%s' "$csp" | grep -q "'nonce-"; then
            echo "CSP is missing a nonce for framework scripts"
            exit 1
          fi

          # Reject accidental wildcard expansion in script-src.
          script_src=$(printf '%s' "$csp" | tr ';' '\n' | grep -i 'script-src' || true)
          if printf '%s' "$script_src" | grep -Eq "(^|[[:space:]])[*]([[:space:]]|$)|https?:\*|\*\."; then
            echo "CSP script-src contains an accidental wildcard: $script_src"
            exit 1
          fi

          # unsafe-inline must not be required for scripts.
          if printf '%s' "$script_src" | grep -q "'unsafe-inline'"; then
            echo "CSP script-src must not rely on 'unsafe-inline'"
            exit 1
          fi

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: next-prod-log
          path: /tmp/next-prod.log
