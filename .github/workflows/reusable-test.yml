name: Reusable Test Workflow

on:
  workflow_call:
    inputs:
      node-version:
        description: 'Node.js version'
        required: false
        type: string
        default: '20'
      skip-frontend:
        description: 'Skip frontend tests'
        required: false
        type: boolean
        default: false
      skip-backend:
        description: 'Skip backend tests'
        required: false
        type: boolean
        default: false
      run-coverage:
        description: 'Generate coverage reports'
        required: false
        type: boolean
        default: true
    outputs:
      frontend-coverage:
        description: 'Frontend coverage report path'
        value: ${{ jobs.frontend-test.outputs.coverage }}
      backend-coverage:
        description: 'Backend coverage report path'
        value: ${{ jobs.backend-test.outputs.coverage }}

jobs:
  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    if: ${{ !inputs.skip-frontend }}
    outputs:
      coverage: ${{ steps.coverage.outputs.path }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test -- --passWithNoTests --ci

      - name: Generate coverage report
        if: ${{ inputs.run-coverage }}
        run: npm test -- --coverage --passWithNoTests --ci
        continue-on-error: true

      - name: Upload coverage report
        if: ${{ inputs.run-coverage && always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-coverage
          path: coverage/
          retention-days: 7

  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    if: ${{ !inputs.skip-backend }}
    outputs:
      coverage: ${{ steps.coverage.outputs.path }}
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npx jest --coverage --passWithNoTests

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-coverage
          path: backend/coverage/
          retention-days: 7
